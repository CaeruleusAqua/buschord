name: CI

on:
  push:
    branches: [development, main]
  # Feature branches use their PR check, avoiding a second run for the same push.
  pull_request:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Run from the repository root, exactly like the README test commands.
  TEST_PROJECTS: |
    tests/Knx.Core.Tests
    tests/Knx.Bus.Tests
    tests/Knx.Owl.Tests
    tests/Knx.Catalog.Tests
    tests/Knx.Mcp.Tests
    tests/Knx.Address.Tests
    tests/Knx.Linking.Tests
    tests/Knx.SmartLink.Tests
    tests/Knx.CatalogUi.Tests
    tests/Knx.Archive.Tests
    tests/Knx.Icon.Tests
    tests/Knx.Monitor.Tests
    tests/Knx.Diagnostics.Tests
    tests/Knx.Search.Tests
    tests/Knx.Buildings.Tests
    tests/Knx.Encryption.Tests
    tests/Knx.Parameter.Tests
    tests/Knx.ParameterUi.Tests
    tests/Knx.Workbench.Tests
    tests/Knx.WorkbenchUiState.Tests
    tests/Knx.RecoveryApp.Tests
    tests/Knx.WorkbenchSessions.Tests
    tests/Knx.WorkbenchTheme.Tests
    tests/Knx.WorkbenchPerformance.Tests
    tests/Knx.Localization.Tests
    tests/Knx.ProjectCompare.Tests
    tests/Knx.Updates.Tests
    src/Knx.App.Tests

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
            Directory.Build.props
      - name: Show SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore BusChord.sln
      - name: Build
        run: dotnet build BusChord.sln -c Release --no-restore --nologo

  test-linux:
    name: test-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
            Directory.Build.props
      - name: Show SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore BusChord.sln
      - name: Build
        run: dotnet build BusChord.sln -c Release --no-restore --nologo
      - name: Console checks
        shell: bash
        run: |
          echo "::notice::Docking/Shell window suites run only on Windows: they require a native display"
          echo "::notice::skipping tests/Knx.Docking.Tests on Linux: native display required"
          echo "::notice::skipping tests/Knx.Shell.Tests on Linux: native display required"
          for project in $(echo "$TEST_PROJECTS" | tr -d '\r'); do
            if [ "$project" = "tests/Knx.Icon.Tests" ]; then
              echo "::notice::skipping $project on Linux: it starts Avalonia with UsePlatformDetect and needs a display"
              continue
            fi
            echo "::group::$project"
            dotnet run --project "$project" -c Release --no-build
            echo "::endgroup::"
          done
          echo "::group::src/Knx.Mcp --selftest"
          dotnet run --project src/Knx.Mcp -c Release --no-build -- --selftest
          echo "::endgroup::"

  test-windows:
    name: test-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
            Directory.Build.props
      - name: Show SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore BusChord.sln
      - name: Build
        run: dotnet build BusChord.sln -c Release --no-restore --nologo
      - name: Console checks
        shell: bash
        run: |
          for project in $(echo "$TEST_PROJECTS" | tr -d '\r'); do
            echo "::group::$project"
            dotnet run --project "$project" -c Release --no-build
            echo "::endgroup::"
          done
          echo "::group::src/Knx.Mcp --selftest"
          dotnet run --project src/Knx.Mcp -c Release --no-build -- --selftest
          echo "::endgroup::"
      - name: App smoke (Windows only)
        run: dotnet run --project src/Knx.App -c Release --no-build -- --smoke
      - name: App screenshot selftest (Windows only)
        run: dotnet run --project src/Knx.App -c Release --no-build -- --screenshot-selftest
      - name: Docking window regressions (Windows only)
        run: dotnet run --project tests/Knx.Docking.Tests -c Release --no-build
      - name: Parameter draft window regressions (Windows only)
        run: dotnet run --project tests/Knx.ParameterUi.Tests -c Release --no-build -- --native
      - name: Project lifecycle window regressions (Windows only)
        run: dotnet run --project tests/Knx.Shell.Tests -c Release --no-build
      - name: V4 state regressions (Windows only)
        shell: bash
        run: |
          for mode in --state-k1 --state-k2 --state-k3 --transaction; do
            dotnet run --project tests/Knx.Shell.Tests -c Release --no-build -- "$mode"
          done
      - name: V4 native dialog regressions (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.WorkbenchUiState.Tests -c Release --no-build -- --dialogs
          dotnet run --project tests/Knx.WorkbenchUiState.Tests -c Release --no-build -- --dialogs --de
      - name: Workbench selection and refresh regressions (Windows only)
        run: dotnet run --project tests/Knx.WorkbenchUiState.Tests -c Release --no-build -- --projection-refresh
      - name: Native bus diagram regressions (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.WorkbenchUiState.Tests -c Release --no-build -- --bus-diagram
          dotnet run --project tests/Knx.WorkbenchUiState.Tests -c Release --no-build -- --bus-diagram --de
      - name: Native bus connection regressions (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-connection
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-connection --de
      - name: Native M112 commissioning regressions (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-m112-commissioning
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-m112-commissioning --de
      - name: Native Secure connection regressions (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-secure-connection
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-secure-connection --de
      - name: Native explicit credential controls with fake vaults (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-credential-vault
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-credential-vault --de
      - name: Native Data Secure selection with synthetic gateways (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-group-selection
          dotnet run --project tests/Knx.WorkbenchSessions.Tests -c Release --no-build -- --native-group-selection --de
      - name: Recovery lifecycle regressions (Windows only)
        shell: bash
        run: |
          dotnet run --project tests/Knx.RecoveryApp.Tests -c Release --no-build -- --native
          dotnet run --project tests/Knx.RecoveryApp.Tests -c Release --no-build -- --native --de
      - name: Workbench native self-check de/light (Windows only)
        run: dotnet run --project src/Knx.App -c Release --no-build -- --workbench-selftest --theme=light --lang=de
      - name: Workbench native self-check en/dark (Windows only)
        run: dotnet run --project src/Knx.App -c Release --no-build -- --workbench-selftest --theme=dark --lang=en

  ci:
    name: ci
    needs: [build, test-linux, test-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail unless every job passed
        if: >-
          needs.build.result != 'success' ||
          needs.test-linux.result != 'success' ||
          needs.test-windows.result != 'success'
        run: exit 1
