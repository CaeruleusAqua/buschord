name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  contents: read

jobs:
  cla:
    name: CLA Assistant
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check or record CLA signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/CaeruleusAqua/buschord/blob/development/CLA.md
          # Signature records live on a dedicated, unprotected branch so pull requests
          # do not carry bot commits.
          branch: cla-signatures
          allowlist: CaeruleusAqua,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/CaeruleusAqua/buschord/blob/development/CLA.md)
            and sign it by posting this comment exactly as written:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          lock-pullrequest-aftermerge: true
