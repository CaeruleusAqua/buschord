name: Bug report
description: Something in BusChord is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please strip customer project data, device keys
        and personal information from anything you paste.

        **Security issues do not belong here.** Report them privately via
        [Security Advisories](https://github.com/CaeruleusAqua/buschord/security/advisories/new),
        see [SECURITY.md](https://github.com/CaeruleusAqua/buschord/blob/development/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error message or the relevant part of the log (`--log`).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BusChord version or commit
      description: Release tag, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Desktop app (UI)
        - Project archive (.knxproj)
        - Catalogue (.knxprod)
        - Parameters / KSXML
        - KNXnet/IP (discovery, tunnel, routing)
        - KNX Data Security
        - Reports / compare / semantic export
        - MCP server
        - Build or tooling
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and version, .NET SDK version (`dotnet --version`).
      placeholder: Windows 11 24H2, .NET SDK 9.0.100
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Sample data
      description: |
        Describe the kind of file involved (vendor, product family, archive
        layout). Do **not** upload `.knxprod`, customer `.knxproj`, keyrings or
        screenshots of real installations.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Bus safety
      description: BusChord can write to real devices. Tell us whether the bug touched hardware.
      options:
        - label: This happened without any live bus connection (offline / parsed files only).
        - label: This happened while connected to a bus or while a write/download was in progress.
        - label: I have removed customer data, keys and personal information from this report.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: This is not a security vulnerability (those go to Security Advisories).
          required: true
