name: Feature request
description: Suggest a capability, a workflow improvement, or a compatibility gap.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [discussions](https://github.com/CaeruleusAqua/buschord/discussions)
        first for open design questions; large features should start there.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does BusChord get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should BusChord do instead? Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other tools, or a narrower version of the idea.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app (UI)
        - Project archive (.knxproj)
        - Catalogue (.knxprod)
        - Parameters / KSXML
        - KNXnet/IP (discovery, tunnel, routing)
        - KNX Data Security
        - Reports / compare / semantic export
        - MCP server
        - Build or tooling
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: BusChord version or commit, OS, and the KNX project schema version you work with.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Bus safety
      options:
        - label: This would involve writing to a bus or downloading devices.
        - label: This needs real manufacturer product data; I understand those files cannot be committed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
